name: SonanceEQ
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '8'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Y4HDXFWXUV
    TARGETED_DEVICE_FAMILY: '1,2'

fileGroups:
  - README.md

targets:
  SonanceEQiOS:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Generate Debug playback UI-test tone
        script: |
          if [[ "$CONFIGURATION" == "Debug" ]]; then
            python3 "$SRCROOT/Tools/generate-ui-playback-fixture.py" \
              "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/SonanceBackgroundVerification.wav"
          fi
        basedOnDependencyAnalysis: false
    sources:
      - path: Sources/App
        excludes:
          - Info.plist
      - Sources/Shared
      - ../Sources/SonanceEQ/Models/EQBand.swift
      - ../Sources/SonanceEQ/Models/Presets.swift
      - ../Sources/SonanceEQ/Models/PresetFile.swift
      - ../Sources/SonanceEQ/DSP/Biquad.swift
      - ../Sources/SonanceEQ/DSP/FilterDesigner.swift
      - ../Sources/SonanceEQ/DSP/FrequencyResponse.swift
      - ../Sources/SonanceEQ/DSP/FIRDesigner.swift
      - path: ../Sources/SonanceEQ/Resources/autoeq.sqlite
        buildPhase: resources
      - path: ../Sources/SonanceEQ/Resources/OPRA-LICENSE.txt
        buildPhase: resources
      - path: ../Sources/SonanceEQ/Resources/openEq-LICENSE.txt
        buildPhase: resources
      - path: ../THIRD-PARTY-NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahdupree.SonanceEQ.iOSPrototype
        CODE_SIGN_ENTITLEMENTS: HostConfig/App.entitlements
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shared/SonanceAnalysis.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sonance EQ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
    dependencies:
      - target: SonanceEQAudioUnit
      - sdk: AppIntents.framework
      - sdk: Accelerate.framework

  SonanceEQAudioUnit:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/AudioUnit
        excludes:
          - Info.plist
      - Sources/Shared
      - ../Sources/SonanceEQ/Models/EQBand.swift
      - ../Sources/SonanceEQ/Models/Presets.swift
      - ../Sources/SonanceEQ/DSP/Biquad.swift
      - ../Sources/SonanceEQ/DSP/FilterDesigner.swift
      - ../Sources/SonanceEQ/DSP/FrequencyResponse.swift
      - ../Sources/SonanceEQ/DSP/FIRDesigner.swift
      - Sources/App/AutoEqCatalog.swift
      - path: ../Sources/SonanceEQ/Resources/autoeq.sqlite
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahdupree.SonanceEQ.iOSPrototype.AudioUnit
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AudioUnit/SonanceRender.h
    dependencies:
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
    info:
      path: Sources/AudioUnit/Info.plist
      properties:
        CFBundleDisplayName: Sonance EQ Audio Unit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SonanceAudioUnitViewController
          NSExtensionAttributes:
            AudioComponents:
              - name: 'Isaiah Dupree: Sonance EQ'
                description: Sonance EQ
                manufacturer: IsDp
                type: aufx
                subtype: SnEQ
                version: 4
                tags: [Effects, Equalizer]

  SonanceEQiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: SonanceEQiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahdupree.SonanceEQ.iOSPrototype.Tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: "Riff Engine local device tests 20261109"
        GENERATE_INFOPLIST_FILE: YES

  SonanceEQiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - Tests/RenderStream.swift
    dependencies:
      - target: SonanceEQiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahdupree.SonanceEQ.iOSPrototype.UITests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: "Riff Engine local device tests 20261109"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SonanceEQiOS:
    build:
      targets:
        SonanceEQiOS: all
    test:
      targets:
        - name: SonanceEQiOSTests
          parallelizable: false
        - name: SonanceEQiOSUITests
          parallelizable: false
