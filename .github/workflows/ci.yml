name: CI

# Public repo → free macOS runners, so CI runs on every push/PR. (Private repos need Actions billing.)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mqtt:
    name: MQTT bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/mqtt/sonance-powerzone-mqtt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/mqtt/sonance-powerzone-mqtt/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint

  smartthings:
    name: SmartThings Edge driver
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/smartthings/sonance-powerzone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Lua test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev lua-socket luarocks
          sudo luarocks --lua-version 5.3 install luacheck

      - name: Test, lint, and package the Edge driver
        run: |
          npm test
          npm run lint
          npm run build

  homey:
    name: Homey Pro app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/homey/com.isaiahdupree.sonanceeq
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/homey/com.isaiahdupree.sonanceeq/package-lock.json

      - name: Install Homey tooling
        run: npm ci

      - name: Test and validate the native app
        run: |
          npm test
          npm run validate

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install integration test tools
        run: python -m pip install aiohttp numpy==2.5.3 pytest ruff==0.16.8

      - name: Lint and test the local Music Assistant client
        run: |
          ruff check --extend-select E402 integrations/home_assistant/custom_components/sonance_eq integrations/home_assistant/tests integrations/home_assistant/scripts
          ruff format --check integrations/home_assistant/custom_components/sonance_eq integrations/home_assistant/tests integrations/home_assistant/scripts
          python -m pytest integrations/home_assistant/tests -q
          node --check integrations/home_assistant/www/sonance-home-card.js

  test:
    name: Build & Test (macOS)
    runs-on: macos-15   # Xcode 16 (Swift Testing); the app only uses macOS 14.4-era Core Audio APIs
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Check shipping audio buffers with Address Sanitizer
        run: /bin/zsh Tools/verify_audio_buffers.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SonanceEQ.xcodeproj \
            -scheme SonanceEQ \
            -destination 'platform=macOS' \
            -jobs 1 -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult

      - name: Build real App Store metadata with incremented version and build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path("appstore.json").read_text())
          parts = config["version"].split(".")
          parts[-1] = str(int(parts[-1]) + 1)
          values = {
              "SONANCE_VERSION_BINDING_TEST_VERSION": ".".join(parts),
              "SONANCE_VERSION_BINDING_TEST_BUILD": str(int(config["build_number"]) + 1),
              "SONANCE_VERSION_BINDING_TEST_APP": os.environ["RUNNER_TEMP"] + "/SonanceVersionBinding/Build/Products/Release-MAS/SonanceEQ.app",
              "SONANCE_PURCHASE_GATE_TEST_APP": os.environ["RUNNER_TEMP"] + "/SonanceDefaultMAS.app",
          }
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Compile default and incremented App Store candidates
        run: |
          set -euo pipefail
          xcodebuild build -project SonanceEQ.xcodeproj -scheme SonanceEQ \
            -configuration Release-MAS -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SonanceVersionBinding" -jobs 1 \
            SWIFT_COMPILATION_MODE=singlefile OTHER_SWIFT_FLAGS=-j1 \
            CODE_SIGNING_ALLOWED=NO DEBUG_INFORMATION_FORMAT=dwarf ONLY_ACTIVE_ARCH=YES \
            SWIFT_OPTIMIZATION_LEVEL=-Onone
          ditto "$SONANCE_VERSION_BINDING_TEST_APP" "$SONANCE_PURCHASE_GATE_TEST_APP"
          xcodebuild build -project SonanceEQ.xcodeproj -scheme SonanceEQ \
            -configuration Release-MAS -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SonanceVersionBinding" -jobs 1 \
            SWIFT_COMPILATION_MODE=singlefile OTHER_SWIFT_FLAGS=-j1 \
            CODE_SIGNING_ALLOWED=NO DEBUG_INFORMATION_FORMAT=dwarf ONLY_ACTIVE_ARCH=YES \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            "MARKETING_VERSION=$SONANCE_VERSION_BINDING_TEST_VERSION" \
            "CURRENT_PROJECT_VERSION=$SONANCE_VERSION_BINDING_TEST_BUILD"

      - name: Verify App Store and RevenueCat configuration checks
        run: |
          python3 -m venv "$RUNNER_TEMP/sonance-purchase-gate-env"
          "$RUNNER_TEMP/sonance-purchase-gate-env/bin/python" -m pip install aiohttp
          "$RUNNER_TEMP/sonance-purchase-gate-env/bin/python" -m unittest discover \
            -s Tools/tests -p 'test_*.py' -v

      - name: Verify purchases and restores with local StoreKit
        run: |
          set -o pipefail
          xcodebuild test \
            -project SonanceEQ.xcodeproj \
            -scheme SonanceEQ-StoreKit \
            -destination 'platform=macOS' \
            -jobs 1 -parallel-testing-enabled NO \
            -only-testing:SonanceEQTests/StoreKitIntegrationTests \
            -resultBundlePath StoreKitResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            StoreKitResults.xcresult
          if-no-files-found: ignore
