name: iOS audio quality

on:
  pull_request:
    paths:
      - 'iOS/**'
      - 'Sources/SonanceEQ/DSP/**'
      - 'Sources/SonanceEQ/Models/**'
      - '.github/workflows/ios-audio-quality.yml'
  push:
    branches:
      - 'codex/sonance-audio-quality-tests-*'
    paths:
      - 'iOS/**'
      - 'Sources/SonanceEQ/DSP/**'
      - 'Sources/SonanceEQ/Models/**'
      - '.github/workflows/ios-audio-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-audio-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  evidence-assessor:
    name: Evidence validators reject failures and missing measurements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s iOS/Tools/tests -p 'test_*.py' -v

  auv3-render:
    name: Installed AUv3 digital quality and continuity
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select an installed Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import glob, os, pathlib, plistlib, re
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              if 'beta' in app.lower():
                  continue
              info = pathlib.Path(app) / 'Contents/Info.plist'
              with info.open('rb') as stream:
                  version = plistlib.load(stream).get('CFBundleShortVersionString', '')
              numbers = tuple(map(int, re.findall(r'\d+', version)))
              if numbers and numbers[0] >= 26:
                  candidates.append((numbers, app + '/Contents/Developer'))
          if not candidates:
              raise SystemExit('No installed Xcode >=26; cannot claim an iOS test pass.')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('DEVELOPER_DIR=' + max(candidates)[1] + '\n')
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run installed AUv3 tests
        env:
          SONANCE_AUDIO_RESULTS_DIR: ${{ runner.temp }}/sonance-audio-quality
        run: bash iOS/Tools/test-audio-quality.sh
      - name: Upload digital evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonance-ios-audio-quality
          path: ${{ runner.temp }}/sonance-audio-quality
          if-no-files-found: warn
